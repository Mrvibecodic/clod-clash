_version: 1
notifications:
  dashboardToggled:
    title: Dashboard
    body: Dashboard visibility has been updated.
  clashModeChanged:
    title: Mode Switch
    body: Switched to {mode}.
  systemProxyToggled:
    title: System Proxy
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: TUN Mode
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: Lightweight Mode
    body: Entered lightweight mode.
  profilesReactivated:
    title: Profiles
    body: Profile Reactivated.
  appQuit:
    title: About to Exit
    body: The app is about to exit.
  quitCancelled:
    title: Exit cancelled
    body: The core did not stop, so the app keeps running.
  sysproxyLeftBehind:
    body: "The system proxy could not be removed on exit. It still points at this app, so traffic will not go through until you clear it in the system settings or start the app again."
  appHidden:
    title: Application Hidden
    body: The app keeps running in the background.
  updateReady:
    title: App Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
  logOpenFailed:
    title: Log
    body: "The log file could not be opened. Look for it in {path}."
  subExpired:
    title: Subscription
    body: Your subscription has expired.
  subExpiresIn:
    title: Subscription
    body: Your subscription expires in {days} d.
  subTraffic:
    title: Subscription
    body: Traffic usage has reached {percent}%.
common:
  modeLocked: The routing mode is managed by your provider.
  exitInProgress: "The app is shutting down: this action was declined while it is closing."
service:
  adminInstallPrompt: Installing the system service requires administrator privileges.
  adminUninstallPrompt: Uninstalling the system service requires administrator privileges.
  selinuxBlocked: >-
    SELinux blocked the background service. Run: sudo chcon -t bin_t /var/lib/clash-verge-service/bin/clash-verge-service
  translocatedCorePath: The app is running from a temporary (App Translocation) path and can't locate the core. Please move it into the Applications folder and reopen it.
