  noAcceptedConfig: "there is no accepted core configuration — it has not been built yet or the core rejected it"
  noFileName: "the core path has no file name: {path}"
  noAnswerInTime: "the core did not answer in time"
  reasonUnknown: "reason unknown"
  noStopAnswer: "no answer in {secs} s"
  diedWhileStarting: "the core process {pid} exited while it was being checked"
  stillRunning: "the core process {pid} did not stop: it is still in the process table"
  emptyBuild: "the built configuration is empty"
  configNotApplied: "The configuration was not applied: {reason}"
  newCoreFailed: "the new core failed to start — the previous one is back"
  previousAlsoFailed: "and the previous core did not start either: {reason}"
  rollbackWriteFailed: "the previous core could not be put back ({reason}), but a core is running again"
  rollbackAndRestartFailed: "the previous core could not be put back ({reason}), and no core started: {restart}"
  sourceNotSaved: "the core accepted the configuration, but its source could not be written: {reason}"
  checkTimedOut: "The core did not finish checking the configuration in {secs} s (timeout)"
  checkCrashed: "The check process crashed, exit code: {code}"
  checkInterrupted: "The check process was interrupted"
