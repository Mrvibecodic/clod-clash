_version: 1
notifications:
  dashboardToggled:
    title: Übersicht
    body: Die Sichtbarkeit der Übersicht wurde aktualisiert.
  clashModeChanged:
    title: Moduswechsel
    body: Auf {mode} umgeschaltet.
  systemProxyToggled:
    title: Systemproxy
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: Virtual Network Interface-Modus
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  tunSetup:
    busy: "The service setup is already running — wait for it to finish and try again"
    pending: "The system rights prompt is still open — confirm it, then turn TUN on again"
    volumeWithoutRights: "TUN is not available for a copy on a FAT/exFAT drive — move the app to an NTFS drive"
  lightweightModeEntered:
    title: Leichtgewichtiger Modus
    body: Leichtgewichtiger Modus aktiviert.
  profilesReactivated:
    title: Abonnement
    body: Abonnement reaktiviert.
    failed: "The subscription was not reapplied: {reason}"
  appQuit:
    title: Beenden steht bevor
    body: Die App wird gleich beendet.
  quitCancelled:
    title: Beenden abgebrochen
    body: Der Kern wurde nicht gestoppt, die App läuft weiter.
  sysproxyLeftBehind:
    body: "Der System-Proxy konnte beim Beenden nicht entfernt werden. Er zeigt weiterhin auf diese App: Bis Sie ihn in den Systemeinstellungen entfernen oder die App erneut starten, läuft kein Datenverkehr."
  proxyHostGone:
    body: "This computer has no address {host} right now, so the system proxy points at 127.0.0.1. It goes back to {host} once the address is back."
  proxyHostRefused:
    body: "The LAN sharing address lists do not let {host} in, so the system proxy points at 127.0.0.1. It goes back to {host} once the lists let it in."
  coreUpdateRolledBack:
    body: The new core kept crashing after the update, so the previous one is back.
  coreRestart:
    done: "The core has been restarted."
    failed: "The core did not restart: {reason}"
  appHidden:
    title: Anwendung ausgeblendet
    body: Die App läuft im Hintergrund.
  updateReady:
    title: App-Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
    installing: Installing the update…
    notInstalled: The update could not be installed. We will try again at the next launch.
    cancelledNoRights: "The update was cancelled: no administrator rights. The app keeps running."
    launchFailed: The update installer could not be started. The app keeps running.
    portableByHand: "The portable version is updated by hand: download the new portable build from the release page."
  logOpenFailed:
    title: Log
    body: "The log file could not be opened. Look for it in {path}."
  subExpired:
    title: Subscription
    body: Your subscription has expired.
  subExpiresIn:
    title: Subscription
    body: Your subscription expires in {days} d.
  subTraffic:
    title: Subscription
    body: Traffic usage has reached {percent}%.
common:
