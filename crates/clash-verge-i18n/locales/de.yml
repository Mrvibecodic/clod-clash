_version: 1
notifications:
  dashboardToggled:
    title: Übersicht
    body: Die Sichtbarkeit der Übersicht wurde aktualisiert.
  clashModeChanged:
    title: Moduswechsel
    body: Auf {mode} umgeschaltet.
  systemProxyToggled:
    title: Systemproxy
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: Virtual Network Interface-Modus
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: Leichtgewichtiger Modus
    body: Leichtgewichtiger Modus aktiviert.
  profilesReactivated:
    title: Abonnement
    body: Abonnement reaktiviert.
  appQuit:
    title: Beenden steht bevor
    body: Die App wird gleich beendet.
  quitCancelled:
    title: Beenden abgebrochen
    body: Der Kern wurde nicht gestoppt, die App läuft weiter.
  sysproxyLeftBehind:
    body: "Der System-Proxy konnte beim Beenden nicht entfernt werden. Er zeigt weiterhin auf diese App: Bis Sie ihn in den Systemeinstellungen entfernen oder die App erneut starten, läuft kein Datenverkehr."
  proxyHostGone:
    body: "This computer has no address {host} right now, so the system proxy points at 127.0.0.1. It goes back to {host} once the address is back."
  proxyHostRefused:
    body: "The LAN sharing address lists do not let {host} in, so the system proxy points at 127.0.0.1. It goes back to {host} once the lists let it in."
  coreUpdateRolledBack:
    body: The new core kept crashing after the update, so the previous one is back.
  appHidden:
    title: Anwendung ausgeblendet
    body: Die App läuft im Hintergrund.
  updateReady:
    title: App-Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
    installing: Installing the update…
    notInstalled: The update could not be installed. We will try again at the next launch.
    cancelledNoRights: "The update was cancelled: no administrator rights. The app keeps running."
    launchFailed: The update installer could not be started. The app keeps running.
    portableByHand: "The portable version is updated by hand: download the new portable build from the release page."
  logOpenFailed:
    title: Log
    body: "The log file could not be opened. Look for it in {path}."
  subExpired:
    title: Subscription
    body: Your subscription has expired.
  subExpiresIn:
    title: Subscription
    body: Your subscription expires in {days} d.
  subTraffic:
    title: Subscription
    body: Traffic usage has reached {percent}%.
common:
  modeLocked: The routing mode is managed by your provider.
  modeSwitching: The subscription is switching — choose the mode once it has opened.
  updateInProgress: This subscription is already updating — wait for it to finish.
  configApplying: The configuration is being applied right now — try again in a couple of seconds.
  exitInProgress: "Die App wird beendet: Die Aktion wurde abgelehnt, solange das Beenden läuft."
  restoreNotApplied: "The backup was restored, but its settings could not be applied. Restart the app. Reason: {reason}"
service:
  adminInstallPrompt: Für die Installation des Systemdienstes sind Administratorrechte erforderlich.
  adminUninstallPrompt: Für die Deinstallation des Systemdienstes sind Administratorrechte erforderlich.
  selinuxBlocked: >-
    SELinux hat den Hintergrunddienst blockiert. Ausführen: sudo chcon -t bin_t /var/lib/clash-verge-service/bin/clash-verge-service
  translocatedCorePath: Die App läuft aus einem temporären Pfad (App Translocation) und findet den Core nicht. Verschieben Sie sie in den Ordner „Programme“ und öffnen Sie sie erneut.
tray:
  dashboard: Übersicht
  ruleMode: Regel-Modus
  globalMode: Globaler Modus
  directMode: Direktverbindungs-Modus
  outboundModes: Ausgangsmodi
  rule: Regel-Modus
  direct: Direktverbindungs-Modus
  directNode: Direkt
  global: Globaler Modus
  profiles: Abonnement
  proxies: Proxy
  systemProxy: Systemproxy
  tunMode: Virtual Network Interface-Modus
  closeAllConnections: Alle Verbindungen schließen
  lightweightMode: Leichtgewichtiger Modus
  copyEnv: Umgebungsvariablen kopieren
  confDir: Konfigurationsverzeichnis
  coreDir: Core-Verzeichnis
  logsDir: Log-Verzeichnis
  openDir: Verzeichnis öffnen
  appLog: Anwendungslog
  coreLog: Core-Log
  restartClash: Core neu starten
  restartApp: Anwendung neu starten
  vergeVersion: App-Version
  more: Mehr
  exit: Beenden
  tooltip:
    systemProxy: Systemproxy
    tun: TUN
    profile: Abonnement
    core: Kern
    coreStopped: nicht gestartet
    'on': 'on'
    'off': 'off'
    noProfile: none
dns:
  missingProxies: "The subscription has no proxy or group named {names} — the core would take the name for a network interface and queries to that server would fail."
  missingRuleSets: "The subscription has no rule set named {names} — the core would refuse to load such a config."
