  subscriptionNotImported: "Could not import the subscription: {reason}"
  reorderFailed: "Could not reorder the subscriptions: {reason}"
  onlyYamlFiles: "Only .yaml or .yml files can be imported"
  notAFile: "The selected path is not a file"
  fileTooLarge: "The file is too large"
  subscriptionNotAdded: "Could not add the subscription: {reason}"
