_version: 1
notifications:
  dashboardToggled:
    title: لوحة التحكم
    body: تم تحديث حالة عرض لوحة التحكم.
  clashModeChanged:
    title: تبديل الوضع
    body: تم التبديل إلى {mode}.
  systemProxyToggled:
    title: وكيل النظام
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: وضع TUN
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: الوضع الخفيف
    body: تم الدخول إلى الوضع الخفيف.
  profilesReactivated:
    title: الملف الشخصي
    body: تمت إعادة تفعيل الملف الشخصي.
  appQuit:
    title: على وشك الخروج
    body: التطبيق على وشك الخروج.
  quitCancelled:
    title: تم إلغاء الخروج
    body: لم يتوقف النواة، ويستمر التطبيق في العمل.
  sysproxyLeftBehind:
    body: "تعذّرت إزالة وكيل النظام عند الخروج. ما زال يشير إلى هذا التطبيق: لن يمر الاتصال حتى تزيله من إعدادات النظام أو تشغّل التطبيق مجددًا."
  proxyHostGone:
    body: "This computer has no address {host} right now, so the system proxy points at 127.0.0.1. It goes back to {host} once the address is back."
  proxyHostRefused:
    body: "The LAN sharing address lists do not let {host} in, so the system proxy points at 127.0.0.1. It goes back to {host} once the lists let it in."
  coreUpdateRolledBack:
    body: The new core kept crashing after the update, so the previous one is back.
  appHidden:
    title: تم إخفاء التطبيق
    body: التطبيق يعمل في الخلفية.
  updateReady:
    title: تحديث التطبيق
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
    installing: Installing the update…
    notInstalled: The update could not be installed. We will try again at the next launch.
    cancelledNoRights: "The update was cancelled: no administrator rights. The app keeps running."
    launchFailed: The update installer could not be started. The app keeps running.
    portableByHand: "The portable version is updated by hand: download the new portable build from the release page."
  logOpenFailed:
    title: Log
    body: "The log file could not be opened. Look for it in {path}."
  subExpired:
    title: Subscription
    body: Your subscription has expired.
  subExpiresIn:
    title: Subscription
    body: Your subscription expires in {days} d.
  subTraffic:
    title: Subscription
    body: Traffic usage has reached {percent}%.
common:
  modeLocked: The routing mode is managed by your provider.
  modeSwitching: The subscription is switching — choose the mode once it has opened.
  updateInProgress: This subscription is already updating — wait for it to finish.
  configApplying: The configuration is being applied right now — try again in a couple of seconds.
  exitInProgress: "التطبيق قيد الإغلاق: تم رفض هذا الإجراء أثناء الخروج."
  restoreNotApplied: "The backup was restored, but its settings could not be applied. Restart the app. Reason: {reason}"
service:
  adminInstallPrompt: يتطلب تثبيت خدمة النظام صلاحيات المسؤول.
  adminUninstallPrompt: يتطلب إلغاء تثبيت خدمة النظام صلاحيات المسؤول.
  selinuxBlocked: >-
    منع SELinux تشغيل خدمة الخلفية. نفّذ: sudo chcon -t bin_t /var/lib/clash-verge-service/bin/clash-verge-service
  translocatedCorePath: يعمل التطبيق من مسار مؤقت (App Translocation) ولا يمكنه العثور على النواة. انقله إلى مجلد التطبيقات وأعد فتحه.
tray:
  dashboard: لوحة التحكم
  ruleMode: وضع القواعد
  globalMode: الوضع العالمي
  directMode: الوضع المباشر
  outboundModes: أوضاع الخروج
  rule: وضع القواعد
  direct: الوضع المباشر
  directNode: مباشر
  global: الوضع العالمي
  profiles: الملفات الشخصية
  proxies: الوكلاء
  systemProxy: وكيل النظام
  tunMode: وضع TUN
  closeAllConnections: إغلاق كل الاتصالات
  lightweightMode: الوضع الخفيف
  copyEnv: نسخ متغيرات البيئة
  confDir: دليل الإعدادات
  coreDir: دليل النواة
  logsDir: دليل السجلات
  openDir: فتح الدليل
  appLog: سجل التطبيق
  coreLog: سجل النواة
  restartClash: إعادة تشغيل النواة
  restartApp: إعادة تشغيل التطبيق
  vergeVersion: إصدار التطبيق
  more: المزيد
  exit: خروج
  tooltip:
    systemProxy: وكيل النظام
    tun: TUN
    profile: الملف الشخصي
    core: النواة
    coreStopped: غير مشغّلة
    'on': 'on'
    'off': 'off'
    noProfile: none
dns:
  missingProxies: "The subscription has no proxy or group named {names} — the core would take the name for a network interface and queries to that server would fail."
  missingRuleSets: "The subscription has no rule set named {names} — the core would refuse to load such a config."
