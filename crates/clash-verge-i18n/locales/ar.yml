  dnsPageUnreadable: "The DNS page {path} cannot be read: {reason}"
  dnsPageUnusable: "The DNS file {path} is unusable: {reason}"
  subscriptionAddressChanged: "The subscription address changed meanwhile"
  subscriptionArrivedEmpty: "The subscription arrived without content"
  subscriptionRemovedMeanwhile: "The subscription was removed during the check — the file was not replaced"
  subscriptionMergedWithContent: "The subscription content is accepted before it is merged into the list, not together with it"
  budgetSpent: "the time allotted to this subscription address has run out"
  budgetTimeout: "the subscription address did not answer in the allotted time"
  subscriptionUrlUnreadable: "The subscription address cannot be read ({reason}): {url}"
  subscriptionUrlNoHost: "The subscription address has no host: {url}"
  panelRefusedDevice: "The panel refused this device"
  legacyTls: "The subscription server only speaks the outdated TLS 1.0/1.1 — TLS 1.2 or 1.3 is required"
  responseTooLarge: "The response is larger than {mib} MiB"
  backupDamaged: "The settings in the backup are damaged"
  backupNotFound: "The backup was not found: {name}"
  backupOnlyZip: "Only .zip backups are supported"
  backupBadName: "Invalid backup name: {name}"
  backupExists: "A backup with this name already exists: {name}"
  backupNotImported: "Could not add the backup: {reason}"
  backupNotExported: "Could not save the backup: {reason}"
  backupNotMoved: "Could not move the backup: {reason}"
