_version: 1
notifications:
  dashboardToggled:
    title: Panel
    body: La visibilidad del panel se ha actualizado.
  clashModeChanged:
    title: Cambio de modo
    body: Cambiado a {mode}.
  systemProxyToggled:
    title: Proxy del sistema
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: Modo TUN
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: Modo ligero
    body: Se ha entrado en el modo ligero.
  profilesReactivated:
    title: Perfiles
    body: Perfil reactivado.
  appQuit:
    title: A punto de salir
    body: La aplicación está a punto de salir.
  quitCancelled:
    title: Salida cancelada
    body: El núcleo no se detuvo; la aplicación sigue funcionando.
  sysproxyLeftBehind:
    body: "No se pudo quitar el proxy del sistema al salir. Sigue apuntando a esta aplicación: hasta que lo elimines en la configuración del sistema o vuelvas a abrirla, no habrá conexión."
  appHidden:
    title: Aplicación oculta
    body: La aplicación se está ejecutando en segundo plano.
  updateReady:
    title: Actualización de la aplicación
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
  logOpenFailed:
    title: Log
    body: "The log file could not be opened. Look for it in {path}."
  subExpired:
    title: Subscription
    body: Your subscription has expired.
  subExpiresIn:
    title: Subscription
    body: Your subscription expires in {days} d.
  subTraffic:
    title: Subscription
    body: Traffic usage has reached {percent}%.
common:
  modeLocked: The routing mode is managed by your provider.
