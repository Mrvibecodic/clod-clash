_version: 1
notifications:
  dashboardToggled:
    title: Окно
    body: Окно приложения показано или скрыто.
  clashModeChanged:
    title: Смена режима
    body: "Режим: {mode}."
  systemProxyToggled:
    title: Системный прокси
    'on': Системный прокси включён.
    'off': Системный прокси выключен.
    writeFailed: "Система не приняла настройки прокси: {reason}"
    failed: "Системный прокси не переключён: {reason}"
  tunModeToggled:
    title: Режим TUN
    'on': Режим TUN включён.
    'off': Режим TUN выключен.
  tunSetup:
    busy: "Настройка службы уже идёт — дождитесь окончания и попробуйте ещё раз"
    pending: "Запрос прав системы ещё открыт — подтвердите его и включите TUN ещё раз"
    volumeWithoutRights: "TUN недоступен для копии на флешке FAT/exFAT — перенесите программу на диск NTFS"
  connectMethodLocked:
    body: Способ подключения задан провайдером.
  lightweightModeEntered:
    title: Облегчённый режим
    body: Включён облегчённый режим.
  profilesReactivated:
    title: Подписка
    body: Подписка применена заново.
    failed: "Подписка не применена заново: {reason}"
  appQuit:
    title: Скорый выход
    body: Приложение скоро завершит работу.
  quitCancelled:
    title: Выход отменён
    body: Ядро не остановилось, приложение продолжает работать.
  sysproxyLeftBehind:
    body: "Не удалось снять системный прокси при выходе. Он всё ещё указывает на приложение: пока вы не уберёте его в настройках системы или не запустите приложение снова, интернет через него не пойдёт."
  proxyHostGone:
    body: "Адреса {host} у компьютера сейчас нет — системный прокси указывает на 127.0.0.1. Когда адрес появится, прокси вернётся на него."
  proxyHostRefused:
    body: "Списки раздачи в локальную сеть не пускают адрес {host} — системный прокси указывает на 127.0.0.1. Когда списки его пустят, прокси вернётся на него."
  coreUpdateRolledBack:
    body: Новое ядро падало после обновления — возвращено прежнее.
  coreRestart:
    done: "Ядро перезапущено."
    failed: "Ядро не перезапустилось: {reason}"
  appHidden:
    title: Приложение скрыто
    body: Приложение работает в фоновом режиме.
  updateReady:
    title: Обновление приложения
    body: Новая версия (v{version}) скачана и готова к установке.
    installNow: Установить сейчас
    later: Позже
    installing: Устанавливаем обновление…
    notInstalled: Не удалось установить обновление. Попробуем снова при следующем запуске.
    cancelledNoRights: Установка отменена — нет прав администратора. Приложение продолжает работать.
    launchFailed: Не удалось запустить установщик обновления. Приложение продолжает работать.
    portableByHand: "Портативная версия обновляется вручную: скачайте новую портативную со страницы релизов."
  logOpenFailed:
    title: Журнал
    body: "Не удалось открыть файл журнала. Он лежит в {path}."
  subExpired:
    title: Подписка
    body: Подписка истекла.
  subExpiresIn:
    title: Подписка
    body: Подписка истекает через {days} дн.
  subTraffic:
    title: Подписка
    body: Израсходовано {percent}% трафика.
