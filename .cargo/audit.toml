# Конфигурация cargo-audit.
#
# Заглушено только то, что приходит в Cargo.lock исключительно через
# tauri-plugin-devtools. Плагин подключается опциональной фичей `tauri-dev`
# (её включают `pnpm dev:tauri` и `cargo clippy-all` c --all-features), в
# релизные артефакты он не попадает. Обновить нечего: 2.1.0 — последняя версия
# плагина.
#
# RUSTSEC-2026-0258 закрыт в h2 0.4.16. Уязвимая ветка (h2 0.3.27) приходит
# через devtools-core -> tonic 0.10 / hyper 0.14; на релизном пути h2 0.4.19.
# RUSTSEC-2026-0293 закрыт в ringbuf 0.5.2. Уязвимая ветка (ringbuf 0.4.8)
# приходит через devtools-core и на релизном пути отсутствует вовсе.
#
# Чтобы ignore не замаскировал настоящую регрессию, его стережёт
# scripts/audit-guard.py: шаг падает, если уязвимая версия станет достижима
# в обход плагина, если `tauri-dev` попадёт в default или если плагин перестанет
# быть optional.
[advisories]
ignore = ["RUSTSEC-2026-0258", "RUSTSEC-2026-0293"]
