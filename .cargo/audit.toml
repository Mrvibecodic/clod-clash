# Конфигурация cargo-audit.
#
# Заглушено только то, что приходит в Cargo.lock исключительно через
# tauri-plugin-devtools. Плагин подключается опциональной фичей `tauri-dev`
# (её включают `pnpm dev:tauri` и `cargo clippy-all` c --all-features), в
# релизные артефакты он не попадает.
#
# RUSTSEC-2026-0293 закрыт в ringbuf 0.5.2. Уязвимая ветка (ringbuf 0.4.8)
# приходит через devtools-core 0.4, который требует ringbuf ^0.4; на релизном
# пути ringbuf нет вовсе.
#
# Чтобы ignore не замаскировал настоящую регрессию, его стережёт джоб guard в
# .github/workflows/cargo-audit.yml: он спрашивает у cargo дерево релизной
# сборки и падает, если ringbuf попадёт туда, если релиз начнёт собираться с
# другими фичами или если в этом файле появится что-то кроме этих ignore.
#
# RUSTSEC-2026-0367/0368/0369 (zip < 9: распаковка `extract` пропускает
# символические ссылки и права за пределы папки) закрыты в zip 9. Наш zip —
# 9, а старый zip 4 приходит только через tauri-plugin-updater: тот
# распаковывает лишь архив обновления, подпись которого уже проверена
# (`Update::download` → `verify_signature`), то есть только наш собственный
# релиз. Сторож падает, если zip < 9 придёт по другому пути.
[advisories]
ignore = ["RUSTSEC-2026-0293", "RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"]
