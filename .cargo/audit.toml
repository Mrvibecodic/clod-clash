# Конфигурация cargo-audit.
#
# RUSTSEC-2026-0258 закрыт в h2 0.4.16. В Cargo.lock уязвимая ветка (h2 0.3.27)
# приходит только через tauri-plugin-devtools -> devtools-core -> tonic 0.10 /
# hyper 0.14. Плагин подключается опциональной фичей `tauri-dev` (её включают
# `pnpm dev:tauri` и `cargo clippy-all` c --all-features), в релизные артефакты
# он не попадает. Обновить нечего: 2.1.0 — последняя версия плагина.
#
# Чтобы ignore не замаскировал настоящую регрессию, его стережёт
# scripts/audit-guard.py: шаг падает, если уязвимая версия h2 станет достижима
# в обход плагина, если `tauri-dev` попадёт в default или если плагин перестанет
# быть optional.
[advisories]
ignore = ["RUSTSEC-2026-0258"]
