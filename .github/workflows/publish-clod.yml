# clod:F6 — публикация собранного релиза.
#
# Запуск: пуш тега `publish-clod-v{версия}` ПОСЛЕ того, как сборка
# release-clod.yml по тегу `clod-v{версия}` закончилась успехом.
#
# Что делает:
#   1. находит черновик релиза clod-v{версия} и проверяет, что сборка
#      действительно приложила все артефакты (включая latest.json);
#   2. публикует его; pre-release — только если в версии есть дефис (тело
#      релиза — из сообщения аннотированного publish-тега, если оно есть);
#   3. переливает latest.json в плавающий релиз `updater-prerelease` всегда,
#      а в `updater`, из которого обновляются установленные клиенты, —
#      только для версии без дефиса;
#   4. удаляет отработавший publish-тег.
#
# Раньше шаги 2–3 делались руками через API после каждой сборки.

name: Publish Clod Clash release

on:
  push:
    tags:
      - 'publish-clod-v*'

permissions:
  contents: write

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and roll the updater tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish the draft as a pre-release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME#publish-}"
          echo "release tag: $RELEASE_TAG"
          VERSION="${RELEASE_TAG#clod-v}"
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac

          id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"$RELEASE_TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            echo "::error::No release found for tag $RELEASE_TAG"
            exit 1
          fi

          # Не публиковать полупустую сборку: должен быть latest.json и
          # артефакты всех трёх платформ.
          assets=$(gh api "repos/${{ github.repository }}/releases/$id/assets?per_page=100" --jq '.[].name')
          echo "assets:"; echo "$assets"
          # линукс собирается как deb+rpm, AppImage у нас нет
          for needle in latest.json setup.exe portable.zip .dmg .deb .rpm; do
            if ! echo "$assets" | grep -qi -- "$needle"; then
              echo "::error::Release $RELEASE_TAG has no asset matching '$needle' — сборка не закончилась?"
              exit 1
            fi
          done

          # Тело релиза — из сообщения аннотированного publish-тега (если есть)
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -n "$NOTES" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/$id" \
              -F draft=false -F prerelease="$PRERELEASE" -f body="$NOTES" --jq .html_url
          else
            gh api -X PATCH "repos/${{ github.repository }}/releases/$id" \
              -F draft=false -F prerelease="$PRERELEASE" --jq .html_url
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

      - name: Roll latest.json into the updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ steps.publish.outputs.release_id }}"
          RELEASE_TAG="${GITHUB_REF_NAME#publish-}"
          VERSION="${RELEASE_TAG#clod-v}"

          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" > assets.json
          asset_id=$(jq -r '.[] | select(.name=="latest.json") | .id' assets.json | head -1)
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/$asset_id" > latest.json
          jq -e .version latest.json

          # Английский ченджлог для окна обновления в приложении: секция
          # `## v{версия}` из UPDATELOG.md. Пустые notes ломали кнопку Update
          # у клиентов 0.0.2 (гард `if (!body) return`), поэтому фолбэк-текст
          # обязателен.
          notes=$(awk -v ver="## v$VERSION" '
            $0 == ver { grab = 1; next }
            /^## v/ || /^---/ { if (grab) exit }
            grab { print }
          ' UPDATELOG.md)
          if [ -z "$notes" ]; then
            echo "::warning::UPDATELOG.md has no section for v$VERSION"
            notes="New version $VERSION is available."
          fi

          # tauri-action генерирует latest.json, пока релиз ещё черновик, и
          # пишет api.github.com-ссылки на ассеты. После публикации меняем их
          # на публичные browser_download_url — их апдейтер качает без
          # заголовков API и без лимитов.
          jq --arg notes "$notes" --slurpfile assets assets.json '
            .notes = $notes
            | .platforms |= with_entries(
                .value.url = (
                  if (.value.url | test("api\\.github\\.com/.*/assets/[0-9]+$")) then
                    ((.value.url | capture("assets/(?<id>[0-9]+)$").id | tonumber) as $id
                     | ($assets[0][] | select(.id == $id) | .browser_download_url) // .value.url)
                  else
                    .value.url
                  end
                )
              )' latest.json > latest.patched.json
          jq -e .version latest.patched.json
          mv latest.patched.json latest.json
          echo "patched latest.json:"; jq '{version, notes, url_sample: (.platforms | to_entries | .[0].value.url)}' latest.json

          ensure_release() {
            local tag="$1" name="$2" body="$3" id
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq .id 2>/dev/null || true)
            case "$id" in
              '' | *[!0-9]*) id="" ;;
            esac
            if [ -z "$id" ]; then
              id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
                -f tag_name="$tag" -f name="$name" -f body="$body" \
                -F draft=false -F prerelease=true --jq .id)
            fi
            echo "$id"
          }

          put_manifest() {
            local id="$1" old
            old=$(gh api "repos/${{ github.repository }}/releases/$id/assets?per_page=100" \
              --jq '.[] | select(.name=="latest.json") | .id' | head -1)
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old"
            fi
            gh api -X POST \
              -H "Content-Type: application/json" \
              --input latest.json \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=latest.json" \
              --jq .state
          }

          pre=$(ensure_release updater-prerelease "Pre-release update manifest" \
            "Service release: latest.json of the newest build, pre-releases included. Do not download installers from here.")
          put_manifest "$pre"
          echo "latest.json rolled into updater-prerelease"

          case "$VERSION" in
            *-*)
              echo "$VERSION is a pre-release, the stable updater manifest stays untouched"
              exit 0
              ;;
          esac

          updater_id=$(gh api "repos/${{ github.repository }}/releases/tags/updater" --jq .id)
          put_manifest "$updater_id"
          echo "latest.json rolled into updater"

      - name: Drop the spent publish tag
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${GITHUB_REF_NAME}" || true
