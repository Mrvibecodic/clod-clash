name: Frontend Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # clod: the filter only decides anything on pull requests; a direct
      # push to main always runs the checks (on push the filter used to
      # compare the wrong base and silently skipped every step).
      - name: Check frontend changes
        if: github.event_name == 'pull_request'
        id: check_frontend
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/**'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.json'
              - '**/*.md'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'knip.json'
              - 'eslint.config.ts'
              - 'tsconfig.json'
              - 'vite.config.*'

      - name: Skip if no frontend changes
        if: github.event_name == 'pull_request' && steps.check_frontend.outputs.frontend != 'true'
        run: echo "No frontend changes, skipping frontend checks."

      - name: Install pnpm
        if: github.event_name != 'pull_request' || steps.check_frontend.outputs.frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        if: github.event_name != 'pull_request' || steps.check_frontend.outputs.frontend == 'true'
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: Restore pnpm cache
        if: github.event_name != 'pull_request' || steps.check_frontend.outputs.frontend == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            pnpm-shared-stable-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'pull_request' || steps.check_frontend.outputs.frontend == 'true'

      - name: Run Prettier check
        if: github.event_name != 'pull_request' || steps.check_frontend.outputs.frontend == 'true'
        run: pnpm format:check

      - name: Run ESLint
        if: github.event_name != 'pull_request' || steps.check_frontend.outputs.frontend == 'true'
        run: pnpm lint

      - name: Run TypeScript typecheck
        if: github.event_name != 'pull_request' || steps.check_frontend.outputs.frontend == 'true'
        run: pnpm typecheck

      - name: Report unused frontend code and dependencies
        if: github.event_name != 'pull_request' || steps.check_frontend.outputs.frontend == 'true'
        run: pnpm knip:report
