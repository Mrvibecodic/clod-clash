name: Clippy Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
  pull_request:
  workflow_dispatch:
env:
  HUSKY: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
permissions:
  contents: read
concurrency:
  # На main — своя группа у каждого коммита: следующий пуш не отменяет
  # ожидающую проверку, которой ждёт релиз.
  group: clippy-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check src-tauri changes
        if: github.event_name == 'pull_request'
        id: check_changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'crates/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.clippy.toml'
              - '.github/workflows/lint-clippy.yml'

      - name: Decide whether to run
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run=${{ steps.check_changes.outputs.rust != 'false' }}" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v7

      # vendor/muda подменяет muda из crates.io, только пока tauri тянет ту же
      # версию: иначе cargo молча берёт крейт из реестра и пишет в Cargo.lock
      # [[patch.unused]] — правка меню трея на Windows пропала бы без следа.
      - name: Guard The Vendored Muda
        if: steps.decide.outputs.run == 'true' && matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          if grep -q '^\[\[patch.unused\]\]' Cargo.lock; then
            fail "Cargo.lock: [[patch.unused]] — vendor/muda больше не подменяет muda, которую тянет tauri"
          fi
          entry=$(grep -A2 '^name = "muda"$' Cargo.lock || true)
          [ -n "$entry" ] || fail "muda пропала из Cargo.lock — проверить, нужен ли ещё vendor/muda"
          if grep -q '^source = ' <<<"$entry"; then
            fail "muda в Cargo.lock берётся не из vendor/muda"
          fi

      - name: Install Rust
        if: steps.decide.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Check Rust Formatting
        if: steps.decide.outputs.run == 'true' && matrix.os == 'ubuntu-22.04'
        run: cargo fmt --all -- --check

      - name: Rust Cache
        if: steps.decide.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: 'v1-rust'
          key: 'rust-shared-1.95.0-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: false
          cache-workspace-crates: false

      - name: Install dependencies (ubuntu only)
        if: steps.decide.outputs.run == 'true' && matrix.os == 'ubuntu-22.04'
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt="sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o APT::Update::Error-Mode=any"
          mirrors=/etc/apt/apt-mirrors.txt
          for attempt in 1 2 3; do
            # the stock mirrors share one domain: when its names do not resolve, go through a mirror elsewhere
            if [ -f "$mirrors" ] && ! timeout 10 getent hosts azure.archive.ubuntu.com > /dev/null; then
              echo "the stock package mirror does not resolve, switching to another one"
              printf 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' |
                sudo tee "$mirrors" > /dev/null
            fi
            if timeout -k 10 120 $apt update && timeout -k 10 210 $apt install -y \
              libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "attempt $attempt failed, next one in 15 s"
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1

      - name: Run Clippy
        if: steps.decide.outputs.run == 'true'
        working-directory: ./src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo clippy-all
          else
            cargo clippy-only
          fi

      - name: Run Tests
        if: steps.decide.outputs.run == 'true'
        working-directory: ./src-tauri
        shell: bash
        run: |
          cargo test --lib --features clippy
          cargo test --workspace --exclude clash-verge --exclude tauri-plugin-clash-verge-sysinfo

      - name: Run Logging Check
        if: steps.decide.outputs.run == 'true' && matrix.os == 'ubuntu-22.04'
        working-directory: ./src-tauri
        shell: bash
        run: |
          cargo install --git https://github.com/clash-verge-rev/clash-verge-logging-check.git --rev d4a8d9c950bbde6c79c27c4e9fc9e2a21ddc8201 --locked
          clash-verge-logging-check
