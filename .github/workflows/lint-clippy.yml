name: Clippy Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  HUSKY: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
permissions:
  contents: read
concurrency:
  group: clippy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check src-tauri changes
        if: github.event_name == 'pull_request'
        id: check_changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.clippy.toml'
              - '.github/workflows/lint-clippy.yml'

      - name: Decide whether to run
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run=${{ steps.check_changes.outputs.rust != 'false' }}" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Install Rust
        if: steps.decide.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
          components: clippy

      - name: Rust Cache
        if: steps.decide.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: 'v1-rust'
          key: 'rust-shared-1.95.0-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: false
          cache-workspace-crates: false

      - name: Install dependencies (ubuntu only)
        if: steps.decide.outputs.run == 'true' && matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run Clippy
        if: steps.decide.outputs.run == 'true'
        working-directory: ./src-tauri
        run: cargo clippy-only

      - name: Run Tests
        if: steps.decide.outputs.run == 'true'
        working-directory: ./src-tauri
        shell: bash
        run: |
          cargo test --lib --features clippy
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --test subscription_headers --features clippy
          fi

      - name: Run Clippy (all features)
        if: >-
          steps.decide.outputs.run == 'true' &&
          matrix.os == 'ubuntu-22.04'
        working-directory: ./src-tauri
        run: cargo clippy-all

      - name: Run Logging Check
        if: steps.decide.outputs.run == 'true' && matrix.os == 'ubuntu-22.04'
        working-directory: ./src-tauri
        shell: bash
        run: |
          cargo install --git https://github.com/clash-verge-rev/clash-verge-logging-check.git
          clash-verge-logging-check
