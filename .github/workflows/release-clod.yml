name: Release Clod Clash

on:
  push:
    tags:
      - 'clod-v*'

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_DEBUG: 0

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: false

jobs:
  check_version:
    name: Check tag against every version field
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compare versions
        run: |
          TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          declare -A VERSIONS
          VERSIONS[package.json]=$(jq -r .version package.json)
          VERSIONS[src-tauri/tauri.conf.json]=$(jq -r .version src-tauri/tauri.conf.json)
          VERSIONS[src-tauri/Cargo.toml]=$(awk '
            /^\[/ { in_package = ($0 == "[package]"); next }
            in_package && /^version *=/ { gsub(/^version *= *"|".*$/, ""); print; exit }
          ' src-tauri/Cargo.toml)
          VERSIONS[Cargo.lock]=$(awk '
            $0 == "name = \"clash-verge\"" { getline; gsub(/^version *= *"|".*$/, ""); print; exit }
          ' Cargo.lock)
          failed=0
          for file in package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml Cargo.lock; do
            echo "tag: $TAG_REF, $file: ${VERSIONS[$file]}"
            if [[ "$TAG_REF" != "clod-v${VERSIONS[$file]}" ]]; then
              echo "::error::Tag $TAG_REF does not match the version in $file (${VERSIONS[$file]:-not found})"
              failed=1
            fi
          done
          exit "$failed"

  prepare_release:
    name: Prepare draft release
    needs: [check_version]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.ensure.outputs.release_id }}
    steps:
      - name: Find or create the draft
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE=false
          case "${TAG#clod-v}" in *-*) PRERELEASE=true ;; esac
          existing=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"$TAG\") | \"\(.id) \(.draft)\"" | head -1)
          if [ -n "$existing" ]; then
            old_id="${existing% *}"
            is_draft="${existing#* }"
            if [ "$is_draft" = "true" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/$old_id"
              echo "dropped stale draft $old_id"
            else
              echo "::error::Release $TAG is already published — bump the version or delete the release first"
              exit 1
            fi
          fi
          id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" \
            -f name="Clod Clash $TAG" \
            -f body="Черновик — наполняется сборкой." \
            -F draft=true -F prerelease="$PRERELEASE" --jq .id)
          echo "created draft $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    name: Build ${{ matrix.target }}
    needs: [check_version, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust-clod'
          key: 'rust-1.95.0-${{ matrix.os }}-${{ matrix.target }}'
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Pnpm install and prebuild
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Tauri build
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Verify app bundle seal (macos only)
        if: matrix.os == 'macos-latest'
        run: codesign --verify --deep --strict --verbose=2 "target/${{ matrix.target }}/release/bundle/macos/Clod Clash.app"

      - name: Portable bundle (windows only)
        if: matrix.os == 'windows-latest'
        run: pnpm portable ${{ matrix.target }}

      - name: Upload portable to the release (windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(Clod.Clash_*_portable.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::portable zip not found"
            exit 1
          fi
          for f in "${files[@]}"; do
            dup=$(gh api "repos/${{ github.repository }}/releases/${{ needs.prepare_release.outputs.release_id }}/assets" \
              --jq ".[] | select(.name==\"$f\") | .id")
            for id in $dup; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              echo "removed previous $f ($id)"
            done
            gh api -X POST \
              -H "Content-Type: application/zip" \
              --input "$f" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.prepare_release.outputs.release_id }}/assets?name=$f" \
              --jq .state
            echo "uploaded $f"
          done

  publish_release:
    name: Publish the release and roll the updater tag
    needs: [prepare_release, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish the draft as a release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_ID="${{ needs.prepare_release.outputs.release_id }}"
          echo "release tag: $RELEASE_TAG (id=$RELEASE_ID)"

          VERSION="${RELEASE_TAG#clod-v}"
          bash scripts/release-assets.sh check "$RELEASE_ID"

          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          NOTES=$(awk -v ver="## v$VERSION" '
            $0 == ver { grab = 1; next }
            /^## v/ || /^---/ { if (grab) exit }
            grab { print }
          ' UPDATELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::UPDATELOG.md has no section for v$VERSION, falling back to the tag message"
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
            NOTES=$(git tag -l --format='%(contents)' "$RELEASE_TAG")
          fi
          if [ -n "$NOTES" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -F draft=false -F prerelease="$PRERELEASE" -f body="$NOTES" --jq .html_url
          else
            gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -F draft=false -F prerelease="$PRERELEASE" --jq .html_url
          fi

      - name: Drop the version from asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release-assets.sh unversion "${{ needs.prepare_release.outputs.release_id }}"

      - name: Roll latest.json into the updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/roll-update-manifest.sh \
            "${{ needs.prepare_release.outputs.release_id }}" "${GITHUB_REF_NAME#clod-v}"
