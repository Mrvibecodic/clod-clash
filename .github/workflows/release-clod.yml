name: Release Clod Clash

on:
  push:
    tags:
      - 'clod-v*'

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_DEBUG: 0

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: false

jobs:
  check_version:
    name: Check tag and package.json version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compare versions
        run: |
          TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          PKG_VERSION=$(jq -r .version package.json)
          EXPECTED_TAG="clod-v$PKG_VERSION"
          echo "tag: $TAG_REF, package.json: $PKG_VERSION"
          if [[ "$TAG_REF" != "$EXPECTED_TAG" ]]; then
            echo "::error::Tag $TAG_REF does not match package.json ($EXPECTED_TAG)"
            exit 1
          fi

  prepare_release:
    name: Prepare draft release
    needs: [check_version]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.ensure.outputs.release_id }}
    steps:
      - name: Find or create the draft
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          existing=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"$TAG\") | \"\(.id) \(.draft)\"" | head -1)
          if [ -n "$existing" ]; then
            old_id="${existing% *}"
            is_draft="${existing#* }"
            if [ "$is_draft" = "true" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/$old_id"
              echo "dropped stale draft $old_id"
            else
              echo "::error::Release $TAG is already published — bump the version or delete the release first"
              exit 1
            fi
          fi
          id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" \
            -f name="Clod Clash $TAG" \
            -f body="Черновик — наполняется сборкой." \
            -F draft=true -F prerelease=false --jq .id)
          echo "created draft $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    name: Build ${{ matrix.target }}
    needs: [check_version, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust-clod'
          key: 'rust-1.95.0-${{ matrix.os }}-${{ matrix.target }}'
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Verify Rust target
        run: rustup target list --installed

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Pnpm install and prebuild
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Tauri build
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Portable bundle (windows only)
        if: matrix.os == 'windows-latest'
        run: pnpm portable ${{ matrix.target }}

      - name: Upload portable to the release (windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(Clod.Clash_*_portable.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::portable zip not found"
            exit 1
          fi
          for f in "${files[@]}"; do
            dup=$(gh api "repos/${{ github.repository }}/releases/${{ needs.prepare_release.outputs.release_id }}/assets" \
              --jq ".[] | select(.name==\"$f\") | .id")
            for id in $dup; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              echo "removed previous $f ($id)"
            done
            gh api -X POST \
              -H "Content-Type: application/zip" \
              --input "$f" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.prepare_release.outputs.release_id }}/assets?name=$f" \
              --jq .state
            echo "uploaded $f"
          done

  publish_release:
    name: Publish the release and roll the updater tag
    needs: [prepare_release, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish the draft as a release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_ID="${{ needs.prepare_release.outputs.release_id }}"
          echo "release tag: $RELEASE_TAG (id=$RELEASE_ID)"

          assets=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name')
          echo "assets:"; echo "$assets"
          for needle in latest.json setup.exe portable.zip .dmg .deb .rpm; do
            if ! echo "$assets" | grep -qi -- "$needle"; then
              echo "::error::Release $RELEASE_TAG has no asset matching '$needle'"
              exit 1
            fi
          done

          VERSION="${RELEASE_TAG#clod-v}"
          NOTES=$(awk -v ver="## v$VERSION" '
            $0 == ver { grab = 1; next }
            /^## v/ || /^---/ { if (grab) exit }
            grab { print }
          ' UPDATELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::UPDATELOG.md has no section for v$VERSION, falling back to the tag message"
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
            NOTES=$(git tag -l --format='%(contents)' "$RELEASE_TAG")
          fi
          if [ -n "$NOTES" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=false -f body="$NOTES" --jq .html_url
          else
            gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=false --jq .html_url
          fi

      - name: Drop the version from asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ needs.prepare_release.outputs.release_id }}"
          VERSION="${GITHUB_REF_NAME#clod-v}"
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | "\(.id) \(.name)"' > assets.list
          while read -r id name; do
            new="${name/_${VERSION}_/_}"
            new="${new/-${VERSION}-1./-}"
            if [ "$new" = "$name" ]; then
              continue
            fi
            gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" -f name="$new" --jq .name
          done < assets.list

      - name: Roll latest.json into the updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ needs.prepare_release.outputs.release_id }}"
          RELEASE_TAG="${GITHUB_REF_NAME}"
          VERSION="${RELEASE_TAG#clod-v}"

          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" > assets.json
          asset_id=$(jq -r '.[] | select(.name=="latest.json") | .id' assets.json | head -1)
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/$asset_id" > latest.json
          jq -e .version latest.json

          notes=$(awk -v ver="## v$VERSION" '
            $0 == ver { grab = 1; next }
            /^## v/ || /^---/ { if (grab) exit }
            grab { print }
          ' UPDATELOG.md)
          if [ -z "$notes" ]; then
            echo "::warning::UPDATELOG.md has no section for v$VERSION"
            notes="New version $VERSION is available."
          fi

          jq --arg notes "$notes" --slurpfile assets assets.json '
            .notes = $notes
            | .platforms |= with_entries(
                .value.url = (
                  if (.value.url | test("api\\.github\\.com/.*/assets/[0-9]+$")) then
                    ((.value.url | capture("assets/(?<id>[0-9]+)$").id | tonumber) as $id
                     | ($assets[0][] | select(.id == $id) | .browser_download_url) // .value.url)
                  else
                    .value.url
                  end
                )
              )' latest.json > latest.patched.json
          jq -e .version latest.patched.json
          mv latest.patched.json latest.json
          echo "patched latest.json:"; jq '{version, notes, url_sample: (.platforms | to_entries | .[0].value.url)}' latest.json

          gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id"
          gh api -X POST \
            -H "Content-Type: application/json" \
            --input latest.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=latest.json" \
            --jq .state

          updater_id=$(gh api "repos/${{ github.repository }}/releases/tags/updater" --jq .id)
          old_asset=$(gh api "repos/${{ github.repository }}/releases/$updater_id/assets?per_page=100" \
            --jq '.[] | select(.name=="latest.json") | .id' | head -1)
          if [ -n "$old_asset" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old_asset"
            echo "removed old latest.json ($old_asset)"
          fi
          gh api -X POST \
            -H "Content-Type: application/json" \
            --input latest.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$updater_id/assets?name=latest.json" \
            --jq .state
