# clod:F6 — выпуск Clod Clash.
#
# Собирает инсталлеры под Windows x64, macOS Apple Silicon и Linux x64,
# подписывает артефакты апдейтера ключом из секретов и прикладывает
# latest.json к черновику релиза. Черновик создаётся ОДИН раз отдельным
# джобом (prepare_release): параллельное создание из матрицы даёт гонку
# и 403 у проигравшего.
#
# Требуемые секреты репозитория (см. docs/RELEASING.md):
#   TAURI_PRIVATE_KEY       — приватный ключ подписи апдейтера
#   TAURI_KEY_PASSWORD      — пароль к нему (если задан при генерации)
#
# Запуск: пуш тега `clod-v{версия}` (версия должна совпадать с package.json).

name: Release Clod Clash

on:
  push:
    tags:
      - 'clod-v*'

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
  # Быстрее собираем релиз в CI: у корневого профиля codegen-units=1 и
  # debug=1 — это самая дорогая (последовательная) часть компиляции.
  # Переопределяем только для CI: бинарь чуть больше/чуть медленнее,
  # для альфы неважно, а виндовый джоб перестаёт упираться в один поток.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_DEBUG: 0

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: false

jobs:
  check_version:
    name: Check tag and package.json version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compare versions
        run: |
          TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          PKG_VERSION=$(jq -r .version package.json)
          EXPECTED_TAG="clod-v$PKG_VERSION"
          echo "tag: $TAG_REF, package.json: $PKG_VERSION"
          if [[ "$TAG_REF" != "$EXPECTED_TAG" ]]; then
            echo "::error::Tag $TAG_REF does not match package.json ($EXPECTED_TAG)"
            exit 1
          fi

  prepare_release:
    name: Prepare draft release
    needs: [check_version]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.ensure.outputs.release_id }}
    steps:
      - name: Find or create the draft
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" \
              -f name="Clod Clash $TAG" \
              -f body="Черновик — наполняется сборкой." \
              -F draft=true -F prerelease=true --jq .id)
            echo "created draft $id"
          else
            echo "reusing release $id"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    name: Build ${{ matrix.target }}
    needs: [check_version, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          # win-arm64 (Windows on ARM) и mac Intel сознательно не собираем —
          # аудитории нет (решения от 30–31.07.2026)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust-clod'
          key: 'rust-${{ matrix.os }}-${{ matrix.target }}'
          # сохранять кэш и при упавшем джобе: иначе падение на позднем шаге
          # (upload) оставляет следующий прогон без кэша и +30 мин компиляции
          cache-on-failure: true
          workspaces: |
            . -> target

      # Явный rustup: экшен тулчейна не добавляет цель к уже предустановленному
      # stable на раннере
      - name: Add Rust target
        run: |
          rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Pnpm install and prebuild
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Tauri build
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      # Портабл-zip для Windows: NSIS-инсталлер имеет 32-битную заглушку и не
      # запускается на Windows Server без WoW64; портаблу нужен только
      # предустановленный WebView2 Runtime.
      - name: Portable bundle (windows only)
        if: matrix.os == 'windows-latest'
        run: pnpm portable ${{ matrix.target }}

      - name: Upload portable to the release (windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # заливаем по release_id: gh release upload по тегу не видит черновики
          shopt -s nullglob
          files=(Clod.Clash_*_portable.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::portable zip not found"
            exit 1
          fi
          for f in "${files[@]}"; do
            gh api -X POST \
              -H "Content-Type: application/zip" \
              --input "$f" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.prepare_release.outputs.release_id }}/assets?name=$f" \
              --jq .state
            echo "uploaded $f"
          done

  # После успеха всех платформ релиз публикуется сам (pre-release), тело —
  # двуязычная (EN+RU) секция из UPDATELOG.md; сообщение тега — фолбэк.
  # Ручной publish-тег (publish-clod.yml) остаётся для перезаливок latest.json.
  publish_release:
    name: Publish pre-release and roll the updater tag
    needs: [prepare_release, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish the draft as a pre-release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_ID="${{ needs.prepare_release.outputs.release_id }}"
          echo "release tag: $RELEASE_TAG (id=$RELEASE_ID)"

          # Не публиковать полупустую сборку: latest.json и артефакты всех
          # трёх платформ (линукс собирается как deb+rpm, AppImage у нас нет).
          assets=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name')
          echo "assets:"; echo "$assets"
          for needle in latest.json setup.exe portable.zip .dmg .deb .rpm; do
            if ! echo "$assets" | grep -qi -- "$needle"; then
              echo "::error::Release $RELEASE_TAG has no asset matching '$needle'"
              exit 1
            fi
          done

          # Тело релиза — двуязычная секция (EN+RU, маркеры <!-- lang:xx -->)
          # из UPDATELOG.md; сообщение тега — только фолбэк на случай, когда
          # секцию забыли добавить.
          VERSION="${RELEASE_TAG#clod-v}"
          NOTES=$(awk -v ver="## v$VERSION" '
            $0 == ver { grab = 1; next }
            /^## v/ || /^---/ { if (grab) exit }
            grab { print }
          ' UPDATELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::UPDATELOG.md has no section for v$VERSION, falling back to the tag message"
            # actions/checkout разворачивает аннотированный тег в коммит;
            # чтобы прочитать сообщение тега, дотягиваем сам тег-объект.
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
            NOTES=$(git tag -l --format='%(contents)' "$RELEASE_TAG")
          fi
          if [ -n "$NOTES" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=true -f body="$NOTES" --jq .html_url
          else
            gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=true --jq .html_url
          fi

      - name: Roll latest.json into the updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ needs.prepare_release.outputs.release_id }}"
          RELEASE_TAG="${GITHUB_REF_NAME}"
          VERSION="${RELEASE_TAG#clod-v}"

          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" > assets.json
          asset_id=$(jq -r '.[] | select(.name=="latest.json") | .id' assets.json | head -1)
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/$asset_id" > latest.json
          jq -e .version latest.json

          # Двуязычный (EN+RU) ченджлог для окна обновления: секция
          # `## v{версия}` из UPDATELOG.md с маркерами <!-- lang:xx -->;
          # приложение само выберет язык. Пустые notes ломали кнопку Update
          # у клиентов 0.0.2 (гард `if (!body) return`) — фолбэк обязателен.
          notes=$(awk -v ver="## v$VERSION" '
            $0 == ver { grab = 1; next }
            /^## v/ || /^---/ { if (grab) exit }
            grab { print }
          ' UPDATELOG.md)
          if [ -z "$notes" ]; then
            echo "::warning::UPDATELOG.md has no section for v$VERSION"
            notes="New version $VERSION is available."
          fi

          # tauri-action пишет api.github.com-ссылки, пока релиз черновик;
          # после публикации меняем их на публичные browser_download_url.
          jq --arg notes "$notes" --slurpfile assets assets.json '
            .notes = $notes
            | .platforms |= with_entries(
                .value.url = (
                  if (.value.url | test("api\\.github\\.com/.*/assets/[0-9]+$")) then
                    ((.value.url | capture("assets/(?<id>[0-9]+)$").id | tonumber) as $id
                     | ($assets[0][] | select(.id == $id) | .browser_download_url) // .value.url)
                  else
                    .value.url
                  end
                )
              )' latest.json > latest.patched.json
          jq -e .version latest.patched.json
          mv latest.patched.json latest.json
          echo "patched latest.json:"; jq '{version, notes, url_sample: (.platforms | to_entries | .[0].value.url)}' latest.json

          # Обновляем ассет и в самом релизе, чтобы фолбэк-эндпоинт
          # releases/latest/download/latest.json тоже отдавал правленую версию.
          gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id"
          gh api -X POST \
            -H "Content-Type: application/json" \
            --input latest.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=latest.json" \
            --jq .state

          updater_id=$(gh api "repos/${{ github.repository }}/releases/tags/updater" --jq .id)
          old_asset=$(gh api "repos/${{ github.repository }}/releases/$updater_id/assets?per_page=100" \
            --jq '.[] | select(.name=="latest.json") | .id' | head -1)
          if [ -n "$old_asset" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old_asset"
            echo "removed old latest.json ($old_asset)"
          fi
          gh api -X POST \
            -H "Content-Type: application/json" \
            --input latest.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$updater_id/assets?name=latest.json" \
            --jq .state
