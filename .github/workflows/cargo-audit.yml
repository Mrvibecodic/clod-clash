name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/release-clod.yml'
      - 'src-tauri/tauri*.conf.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/cargo-audit.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/release-clod.yml'
      - 'src-tauri/tauri*.conf.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/cargo-audit.yml'

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      # Заглушка в .cargo/audit.toml законна, только пока ringbuf не едет в
      # релиз. Ответ даёт сам cargo: дерево сборки с фичами по умолчанию (так
      # собирает release-clod.yml) для всех платформ.
      - name: Guard The Ignored Advisory
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          expected=$'[advisories]\nignore = ["RUSTSEC-2026-0293"]'
          actual=$(grep -vE '^[[:space:]]*(#|$)' .cargo/audit.toml || true)
          [ "$actual" = "$expected" ] ||
            fail ".cargo/audit.toml изменился — сторож проверяет не то, что заглушено: ${actual//$'\n'/; }"

          # Уязвимы ringbuf < 0.5.2. Нет их в локе — заглушка лишняя.
          vulnerable='^(0\.[0-4]\.|0\.5\.[01]$)'
          grep -A1 '^name = "ringbuf"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p' | grep -qE "$vulnerable" ||
            fail "уязвимого ringbuf в Cargo.lock не осталось — ignore RUSTSEC-2026-0293 больше не нужен"

          # Дерево ниже верно, только пока релиз собирается с фичами по
          # умолчанию: шаг tauri-action сверяется целиком, а не поиском флагов.
          release=.github/workflows/release-clod.yml
          [ -f "$release" ] || fail "$release не найден — сторож не видит, как собирается релиз"
          args=$(grep -E '^[[:space:]]*args:' "$release" | sed 's/^[[:space:]]*//' || true)
          # Эталон собран printf: выражение GitHub в тексте шага подставилось бы
          # ещё до запуска (здесь matrix нет — осталась бы пустая строка).
          [ "$args" = "$(printf 'args: --target $%s' '{{ matrix.target }}')" ] ||
            fail "шаг сборки в $release передаёт не только --target: ${args//$'\n'/; }"
          if grep -nE 'tauriScript|TAURI_CONFIG' "$release"; then
            fail "$release меняет сборку в обход args — дерево ниже проверяет не ту сборку"
          fi
          grep -q '^    "tauri": "tauri",$' package.json ||
            fail "скрипт tauri в package.json изменился — релиз может собираться с другими фичами"
          confs=(src-tauri/tauri*.conf.json)
          [ -f "${confs[0]}" ] || fail "src-tauri/tauri*.conf.json не найдены"
          if grep -n '"features"' "${confs[@]}"; then
            fail "tauri*.conf.json задаёт фичи сборки — дерево ниже проверяет не ту сборку"
          fi

          tree=$(cargo tree --locked -p clash-verge -e normal,build --target all --prefix none --format '{p}')
          grep -q '^tauri v' <<<"$tree" || fail "cargo tree вернул пустое дерево"
          if grep -qE '^ringbuf v(0\.[0-4]\.|0\.5\.[01]( |$))' <<<"$tree"; then
            grep -E '^ringbuf v' <<<"$tree" | sort -u
            fail "уязвимый ringbuf попал в релизную сборку — RUSTSEC-2026-0293 затрагивает не только dev"
          fi
          echo "уязвимый ringbuf только в dev-сборке (фича tauri-dev), в релизном дереве его нет"

  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-audit-bin

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22

      - name: Run Cargo Audit
        run: cargo audit --file Cargo.lock

  frontend-audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run pnpm audit
        run: pnpm audit --audit-level high --prod
